services:
  - type: web
    name: monakabu-realtime-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: realtime/backend
    dockerfilePath: ./realtime/backend/Dockerfile
    dockerContext: ./realtime/backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: monakabu-realtime-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: MONAKABU_SHARED_SECRET
        sync: false
      - key: MONAKABU_SERVER_ID
        value: monaka-main
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SIGNATURE_MAX_AGE_SECONDS
        value: "300"

databases:
  - name: monakabu-realtime-db
    plan: free
    region: singapore
    databaseName: monakabu_realtime
    user: monakabu
    ipAllowList: []
