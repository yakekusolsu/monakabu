name: monakabu-realtime

services:
  db:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monakabu_realtime}
      POSTGRES_USER: ${POSTGRES_USER:-monakabu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      # PostgreSQL 18+ stores clusters in a major-version-specific child
      # directory. Mount the parent so future pg_upgrade operations do not
      # cross a mount-point boundary. This also works with earlier images.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "5"

  api:
    build:
      context: ../../realtime/backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "10000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-monakabu}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-monakabu_realtime}
      DATABASE_SSL: "false"
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      MONAKABU_SHARED_SECRET: ${MONAKABU_SHARED_SECRET:?MONAKABU_SHARED_SECRET must be set}
      MONAKABU_SERVER_ID: ${MONAKABU_SERVER_ID:-monaka-main}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://monakabu-realtime-dashboard.vercel.app}
      SIGNATURE_MAX_AGE_SECONDS: ${SIGNATURE_MAX_AGE_SECONDS:-300}
      WEB_SESSION_DAYS: ${WEB_SESSION_DAYS:-14}
      WEB_MAX_SHARES_PER_ORDER: ${WEB_MAX_SHARES_PER_ORDER:-1000}
    ports:
      - 127.0.0.1:${API_PORT:-10000}:10000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:10000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres-data:
