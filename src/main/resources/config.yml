locale: ja_JP
timezone: Asia/Tokyo
currency:
  display-name: MONA

database:
  type: sqlite # sqlite / mysql / mariadb
  sqlite-file: monakabu.db
  host: localhost
  port: 3306
  name: monakabu
  username: root
  password: change-me
  pool-size: 10
  connection-timeout-ms: 10000

season:
  enabled: true
  duration-days: 14
  end-day: SUNDAY
  anchor-date: '2026-08-23'
  settlement-time: '21:00'
  auto-start-next-season: true
  check-interval-seconds: 20
  settlement-batch-size: 200
  notifications: [24h, 12h, 6h, 1h, 30m, 10m, 5m, 1m]
  presentation:
    broadcast: true
    title: true
    title-text: '<gold><bold>Season <season> 終了</bold>'
    subtitle-text: '<yellow>全保有株を最終価格で決済しました'
    actionbar: true
    actionbar-text: '<green>次のシーズンを準備しています…'
    sound: true
    sound-name: minecraft:block.note_block.pling
    sound-volume: 1.0
    sound-pitch: 1.0

market:
  price-update-interval: 5m
  # 全銘柄の通常変動をまとめて調整します。1.0が基準、1.5で約1.5倍です。
  volatility-multiplier: 1.5
  max-change-per-update: 0.20
  trend-change-interval: 6h
  trend-bull-weight: 20
  trend-normal-weight: 60
  trend-bear-weight: 20
  bull-bias: 0.03
  bear-bias: -0.03
  mean-reversion: 0.015
  history-retention-detailed-days: 30

events:
  enabled: true
  check-interval: 30m
  chance-per-check: 0.15

daily-report:
  enabled: true
  time: '21:15'
  check-interval-seconds: 30
  game-broadcast: true
  webhook: true
  site: true

fees:
  buy:
    percent: 1.0
  sell:
    percent: 2.0

capital-gains-tax:
  enabled: true
  percent: 10.0

# MonaKabu v2 インフレ対策。すべてリロード可能で、値はハードコードされません。
trading-rules:
  order-limit: 100
  max-shares-per-stock: 1000
  minimum-hold: 5m
  fees:
    buy-percent: 2.0
    sell-percent: 3.0
  slippage:
    up-to-10: 0.0
    up-to-25: 0.5
    up-to-50: 1.0
    up-to-75: 2.0
    up-to-100: 3.0
  large-sell-fee:
    up-to-25: 0.0
    up-to-50: 1.0
    up-to-75: 3.0
    up-to-100: 5.0
  short-term-tax:
    under-30m: 20.0
    under-1h: 15.0
    under-6h: 10.0
  progressive-tax:
    up-to-100000: 5.0
    up-to-500000: 10.0
    up-to-1000000: 20.0
    up-to-5000000: 30.0
    above-5000000: 40.0
  asset-tiers:
    tier1: {minimum-assets: 0, order-limit: 100, additional-fee-percent: 0.0}
    tier2: {minimum-assets: 1000001, order-limit: 75, additional-fee-percent: 1.0}
    tier3: {minimum-assets: 5000001, order-limit: 50, additional-fee-percent: 2.0}
    tier4: {minimum-assets: 10000001, order-limit: 25, additional-fee-percent: 4.0}
  price-limit:
    24h-percent: 25.0
  circuit-breaker:
    # 保有上限・値幅制限を維持し、自動取引停止は行いません。
    enabled: false
    window-10m: {window: 10m, change-percent: 10.0, cooldown: 5m}
    window-30m: {window: 30m, change-percent: 15.0, cooldown: 15m}
    window-1h: {window: 1h, change-percent: 20.0, cooldown: 30m}
  season-carryover:
    up-to-500000: 100.0
    up-to-2000000: 80.0
    up-to-5000000: 60.0
    above-5000000: 40.0

limits:
  # 0 = 個数上限なし（残高・数値精度の安全チェックは維持）
  max-shares-per-stock: 0
  # 0 = 投資総額の上限なし。購入時は手数料込みで残高を検証します。
  max-total-investment: 0
  # LuckPerms/Bukkit権限 monakabu.limit.shares.<数値> と monakabu.limit.investment.<数値> で上書きできます。

circuit-breaker:
  enabled: true
  change-percent: 30
  cooldown: 10m

bankruptcy:
  enabled: false
  threshold: 25
  chance-per-update: 0.005

season-rewards:
  enabled: false
  places:
    '1':
      money: 10000
      commands: []
    '2': {money: 5000, commands: []}
    '3': {money: 2500, commands: []}

webhook:
  enabled: false
  url: ''
  username: MonaKabu
  timeout-seconds: 5
  chart-enabled: true
  chart-interval: 5m
  chart-period: 24h
  chart-points: 32
  chart-only-when-open: true

# 中継APIへ、公開可能な市場データだけを署名して送信します。
# 秘密鍵はconfig.ymlへ直接書かず、原則として環境変数へ設定してください。
realtime:
  enabled: false
  endpoint: 'https://monakabu-live.duckdns.org/v1/ingest'
  server-id: monaka-main
  # MonaPrice導入時、アイテム相場を同じRealtimeサイトへ公開します。
  monaprice-enabled: true
  secret-environment-variable: MONAKABU_REALTIME_SECRET
  secret: ''
  allow-insecure-http: false
  dispatch-interval: 1s
  snapshot-interval: 60s
  # サイトへ公開する現在シーズンのランキング人数（3～500）。
  ranking-limit: 100
  request-timeout: 8s
  batch-size: 25
  outbox-retention-days: 7
  retry:
    initial-backoff: 5s
    maximum-backoff: 5m
    # 0は無制限再送。公開サーバーでは0を推奨します。
    max-attempts: 0

# /monakabu link でサイトと連携し、オフライン中も注文を処理します。
web-trading:
  enabled: true
  # /monakabu link で表示する公開サイト。Bedrockフォームにも使用します。
  site-url: 'https://monakabu-realtime-dashboard.vercel.app/'
  link-code-lifetime: 10m
  order-poll-interval: 2s
  # 0 = 1注文あたりの個数上限なし
  max-shares-per-order: 0

hologram:
  max-count: 20
  chart-period: 24h
  chart-points: 32
  line-width: 240
  view-range: 64

settlement:
  include-sell-fee: false
  include-capital-gains-tax: false

performance:
  db-threads: 4
  ranking-cache-seconds: 60
